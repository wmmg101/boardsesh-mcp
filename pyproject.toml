[project]
name = "boardsesh-mcp"
version = "0.1.0"
description = "Unofficial MCP server giving AI agents read-only access to your Boardsesh climbing logbook across Kilter, Tension, MoonBoard and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "boardsesh-mcp contributors" }]
keywords = [
    "mcp",
    "boardsesh",
    "kilter",
    "tension",
    "moonboard",
    "climbing",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx2>=2.13.0,<3",
    # zoneinfo has no system database on Windows.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/wmmg101/boardsesh-mcp"
Issues = "https://github.com/wmmg101/boardsesh-mcp/issues"

[project.scripts]
boardsesh-mcp = "boardsesh_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardsesh_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]
